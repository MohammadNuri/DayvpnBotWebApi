trigger:
- master

pool:
  name: linux-wsl-pool

steps:
- checkout: self

# Ensure Docker daemon is reachable (safety check)
- script: |
    docker info
  displayName: Check Docker daemon

# Build and run full stack using docker-compose
- script: |
    cd DayvpnBotWebApi

    echo "Stopping existing containers..."
    docker compose down || true

    echo "Building and starting services..."
    docker compose up -d --build
  displayName: Run full stack with docker-compose

# Optional: show running containers (for logs/debug)
- script: |
    docker ps
  displayName: Show running containers
