version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_dayvpn
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dayvpn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      timeout: 5s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dayvpn
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: darvyxe@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  dayvpn-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dayvpn-bot
    environment:
      - ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=dayvpn;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Redis__Host=localhost:6379,password=${REDIS_PASSWORD},connectTimeout=10000,connectRetry=5,abortConnect=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - nuget_cache:/root/.nuget/packages
      - ./Src/Images:/app/Src/Images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  postgres_data:
  nuget_cache:
  redis_data:
